<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TPE Playground social card</title>
    <!-- Open as card.html?v=2d or card.html?v=3d (default). -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { background: #15181c; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #eef0f2;
        background:
          radial-gradient(620px 420px at 840px 330px, rgba(86, 180, 233, 0.14), transparent 70%),
          #21252b;
      }
      .brand {
        position: absolute;
        left: 56px;
        top: 52px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img { width: 84px; height: 84px; }
      h1 {
        font-size: 88px;
        font-weight: 780;
        letter-spacing: -0.03em;
        line-height: 1;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      }
      .tagline {
        position: absolute;
        left: 60px;
        top: 162px;
        z-index: 2;
        font-size: 36px;
        line-height: 1.22;
        font-weight: 550;
        color: #c3c8cf;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
      }
      .tagline em {
        font-style: normal;
        font-weight: 780;
        color: #6cc4f2;
      }
      .tippy {
        position: absolute;
        z-index: 3;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.4));
      }
      .art { position: absolute; z-index: 1; }

      /* 3D */
      .v3d .tagline { width: 400px; }
      .v3d .art { left: 150px; top: 8px; width: 1331px; }
      .v3d .tippy { left: 34px; top: 318px; width: 340px; }

      /* 2D */
      .v2d .tagline { width: 400px; }
      .v2d .art { left: 420px; top: 236px; width: 760px; }
      .v2d .tippy { left: 26px; top: 330px; width: 330px; }
      .v2d .surface, .v3d .chart { display: none; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="brand">
        <img src="../../public/favicon.svg" alt="" />
        <h1>TPE Playground</h1>
      </div>
      <p class="tagline">Tree-structured Parzen Estimator, <em>interactive.</em></p>
      <img class="art surface" src="play3d-surface.png" alt="" />
      <img class="art chart" src="chart-clean.svg" alt="" />
      <img class="tippy" src="tippy-pointing.png" alt="" />
    </div>
    <script>
      const v = new URLSearchParams(location.search).get("v") === "2d" ? "v2d" : "v3d";
      document.getElementById("card").classList.add(v);
    </script>
  </body>
</html>
